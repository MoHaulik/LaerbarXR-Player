        // eller over kan ikke ramme dem og placeres præcis som angivet.
        const rel1 = layoutBlock(1);
        const yawFromChrome = Math.abs(((yaw0 + 180) % 360 + 360) % 360 - 180);
        const chromeHalfYaw = (showExitButton() && hasReplayButton(node)) ? CHROME_WITH_REPLAY_HALF_YAW_DEG : CHROME_HALF_YAW_DEG;
        const canHitChrome = (yawFromChrome - rel1.halfWidth) < chromeHalfYaw;

        let blockTopDeg = anchor.pitchDeg;
        let fit = 1;
        if (canHitChrome) {
          // Løft hellere en blok, der ikke passer, end at krympe den, så teksten
          // forbliver læselig. Først når den er løftet til MAX_BLOCK_TOP_DEG,
          // krymper den.
          blockTopDeg = Math.min(MAX_BLOCK_TOP_DEG,
            Math.max(anchor.pitchDeg, ANSWER_BLOCK_FLOOR_DEG + rel1.extent));
          const budgetDeg = Math.max(0, blockTopDeg - ANSWER_BLOCK_FLOOR_DEG);
          if (rel1.extent > budgetDeg) fit = Math.max(MIN_BLOCK_FIT, budgetDeg / rel1.extent);
        }
        const laid = fit === 1 ? rel1 : layoutBlock(fit);

        // Blokken blev løftet for at gå fri af Afslut. I Builders preview sendes
        // den reelle højde tilbage, så Lodret passer med det, forfatteren ser.
        // Ellers ville den falde ned igen, når den flyttes til siden.
        if (previewEmbedMode && blockTopDeg > anchor.pitchDeg + 0.01) {
          try { parent.postMessage({ type: 'lxrPreviewLift', nodeId: node.id, pitchDeg: blockTopDeg }, '*'); } catch (_) {}
        }

        laid.placements.forEach(p => {
          if (fit !== 1) p.mesh.scale.setScalar(fit);
          qGroup.add(p.mesh);
          positionMeshFromAngles(p.mesh, yaw0 + p.yawOff, blockTopDeg + p.pitchOff, Q_RADIUS);
        });
        (confirmMesh ? choiceMeshes.concat([confirmMesh]) : choiceMeshes).forEach(m => {
          attachProgressRing(m);
          // Kigge-ringen er 0,84 bred; kun svar mindre end det (Size under 1) får
          // en mindre ring.
          const ringFit = m.userData.boxHeight * 0.95 / 0.84;
          if (ringFit < 1) m.getObjectByName('progressRing').scale.setScalar(ringFit);
          activeChoices.push(m);
        });

        // Fortæl Play-knappen, hvor langt ned svarene når, så den kan finde plads
        // under dem (se showPlayGate()). En blok der ikke kan nå knapperne,
        // påvirker den ikke.
        answerBlockBottomDeg = canHitChrome ? (blockTopDeg - laid.extent) : null;

        qGroup.userData = { startTime: node.questionTime || 0, endTime: Infinity, isOverlay: true };
        qGroup.visible = false;
        overlaysGroup.add(qGroup);
      }

      // Afslut: et blik-mål lavt i synsfeltet, langt fra svarene, med længere
      // kigge-tid, så den ikke vælges ved et uheld. Findes på alle scener undtagen
      // slutscener. Står i faste grader (EXIT_PITCH_DEG), ikke i forfatterens X/Y.
      // Forfatteren kan fjerne Afslut for hele simulationen (hideExit); så slutter
      // eleven ved at gennemføre, ved lærerens stop, eller ved inaktivitet.
      if (node.type !== 'end' && showExitButton()) {
        const exitMesh = createTextPlane('✕ Afslut', {
          width: 360, height: 120, fontSize: 40,
          backgroundColor: 'rgba(17,24,39,0.75)', textColor: '#fca5a5', fontWeight: '600', scale: 0.7
        });
        positionMeshFromAngles(exitMesh, 0, EXIT_PITCH_DEG, EXIT_RADIUS);
        exitMesh.userData = { isChoice: true, choiceData: { __exit: true, label: 'exit' }, dwell: Math.max(2.5, currentDwell * 1.5) };
        attachProgressRing(exitMesh);
        overlaysGroup.add(exitMesh);
        activeChoices.push(exitMesh);
      }

      // "↻ Se igen": starter scenens video forfra. Sættes pr. scene med det
      // sekund, den vises. Samme udseende og kigge-tid som Afslut.
      if (hasReplayButton(node)) {
        const replayMesh = createTextPlane('↻ Se igen', {
          width: 360, height: 120, fontSize: 40,
          backgroundColor: 'rgba(17,24,39,0.75)', textColor: '#93c5fd', fontWeight: '600', scale: 0.7
        });
        positionMeshFromAngles(replayMesh, showExitButton() ? REPLAY_YAW_DEG : 0, EXIT_PITCH_DEG, EXIT_RADIUS);
        const at = Math.max(0, parseFloat(node.replayTime) || 0);
        replayMesh.userData = { isChoice: true, choiceData: { __replay: true, label: 'replay' }, dwell: Math.max(2.0, currentDwell),
                                isOverlay: true, startTime: at, endTime: Infinity };
        replayMesh.visible = at === 0;
        attachProgressRing(replayMesh);
        overlaysGroup.add(replayMesh);
        activeChoices.push(replayMesh);
      }
    }

    function showExitButton() { return !(sessionData && sessionData.hideExit === true); }
    function hasReplayButton(node) { return !!(node && node.type !== 'end' && node.replayEnabled); }
    function isMultiNode(node) { return !!(node && node.questionMode === 'multi' && node.choices && node.choices.length); }
    // Players egen knap, aldrig et svar: holder ikke auto-advance tilbage.
    function isChromeChoice(c) {
      const d = c.userData.choiceData;
      return !!(d && (d.__exit || d.__replay));
    }

    // En ring på det svar, eleven kigger på, viser at valget er ved at ske, så
    // man kan nå at kigge væk. Kun det ene mål får ny geometri pr. frame.
    function attachProgressRing(mesh) {
      const geo = new THREE.RingGeometry(0.28, 0.34, 40, 1, 0, 0.0001);
      const mat = new THREE.MeshBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.95, side: THREE.DoubleSide });
      const ring = new THREE.Mesh(geo, mat);
      ring.name = 'progressRing';
      ring.position.set(0, 0, 0.02);
      ring.visible = false;
      mesh.add(ring);
    }

    // Forfatterens X/Y i procent → yaw/pitch i grader, i projektets
    // koordinatsystem (se COORD_*).
    //   yaw   — 0 lige frem, positiv til elevens højre
    //   pitch — 0 i horisonten, positiv op
    function anglesFromXY(pctX, pctY) {
      let x = parseFloat(pctX); if (!isFinite(x)) x = 50;
      let y = parseFloat(pctY); if (!isFinite(y)) y = 50;
      if (coordSpace() === COORD_SPHERE) {
        // Ækvirektangulær: hele kuglen kan nås. Pitch holdes lige inden for polerne,
        // fordi lookAt() ikke har nogen defineret roll ved ±90°; 88° ser ud som lige op.
        return {
          yawDeg: (x - 50) / 100 * 360,
          pitchDeg: Math.max(-88, Math.min(88, (50 - y) / 100 * 180))
        };
      }
      return { yawDeg: (x - 50) / 100 * 90, pitchDeg: (50 - y) / 100 * 50 };
    }

    // Placér en mesh på en kugle med given radius ved yaw/pitch og vend den mod midten.
    function positionMeshFromAngles(mesh, yawDeg, pitchDeg, radius) {
      const yaw = yawDeg * Math.PI / 180;
      const pitch = pitchDeg * Math.PI / 180;
      mesh.position.set(
        radius * Math.sin(yaw) * Math.cos(pitch),
        radius * Math.sin(pitch),
        -radius * Math.cos(yaw) * Math.cos(pitch)
      );
      mesh.lookAt(0, 0, 0);
    }

    function positionMeshFromXY(mesh, pctX, pctY, radius) {
      const a = anglesFromXY(pctX, pctY);
      positionMeshFromAngles(mesh, a.yawDeg, a.pitchDeg, radius);
    }

    // En mesh' størrelse som vinkel ved en given radius; den enhed layoutet
    // af spørgsmål og svar regner i.
    function degAtRadius(worldSize, radius) {
      return (worldSize / radius) * (180 / Math.PI);
    }

    // === Valg ===
    // `isAuto` betyder, at render-loopet navigerede, fordi tidslinjen løb ud uden
    // valg. Det logges som `auto_advance`, aldrig som `choice_made`, så CSV'en
    // aldrig får et svar, ingen elev gav.
    function selectChoice(choice, isAuto, mesh) {
      // Play-knappen håndteres før låsen for sceneskift.
      if (choice && choice.__retryPlay) {
        clearPlayGate();
        isTransitioning = false;
        updateGazeProgress(0);
        const p = videoElement.play();
        if (p && p.catch) p.catch(() => showPlayGate());
        return;
      }

      // Afslut i VR. selfExit=true: eleven valgte det selv, så "Session Done"-
      // kortet springes over (se endSession).
      if (choice && choice.__exit) {
        isTransitioning = true;
        endReason = 'exit';
        endSession(true);
        return;
      }

      if (choice && choice.__replay) { replayCurrentNode(); return; }
      if (mesh && mesh.userData.multiToggle) { toggleMultiChoice(mesh); return; }
      if (choice && choice.__confirm) { confirmMultiChoice(); return; }
      if (choice && choice.__continue) { continueAfterMulti(); return; }

      if (isTransitioning) return;
      isTransitioning = true;

      const nowSec = +((performance.now() - sessionStartTime) / 1000).toFixed(2);
      if (isAuto) {
        sessionLog.push({
          action: 'auto_advance', node: currentNode.id, node_title: currentNode.title,
          target: choice.target,
          session_time_sec: nowSec, node_time_sec: +nodeTimer.toFixed(2)
        });
      } else {
        sessionLog.push({
          action: 'choice_made', node: currentNode.id, node_title: currentNode.title,
          question: currentNode.question || '',
          choice: choice.label, choice_index: (currentNode.choices || []).indexOf(choice), correct: choice.correct, target: choice.target,
          session_time_sec: nowSec, node_time_sec: +nodeTimer.toFixed(2)
        });
        recordLiveAnswer(currentNode.id, choice.correct === true, [(currentNode.choices || []).indexOf(choice)]);
      }
      updateGazeProgress(0);
      goToNode(choice.target || currentNode.defaultNext);
    }

    function goToNode(nextNodeId) {
      if (nextNodeId) {
        const nextNode = sessionData.nodes.find(n => n.id === nextNodeId);
        if (nextNode) {
          // Sæt currentNode i BEGGE grene. Ellers blev render-loopet ved med at
          // køre den forrige scenes tidslinje og skrev dobbelte rækker.
          currentNode = nextNode;
          loadNode(nextNode);
          if (nextNode.type === 'end') {
            // Slutscenens varighed, ellers 3 s.
            const secs = parseFloat(nextNode.duration);
            scheduleEndSession((secs > 0 ? secs : 3) * 1000);
          }
        } else { endSession(); }
      } else { endSession(); }
    }

    // Kun første svar pr. spørgsmål. Et gentaget spørgsmål logges fuldt, men
    // statistikken bruger første forsøg. a = valgte svar som indeks i scenens
    // choices, så Dashboardet kan vise, hvordan klassen fordelte sig.
    function recordLiveAnswer(nodeId, ok, picks) {
      if (liveAnswers.some(a => a.n === nodeId) || liveAnswers.length >= 200) return;
      liveAnswers.push({ n: nodeId, c: ok ? 1 : 0, a: (picks || []).filter(i => i >= 0) });
      sendHeartbeat();   // Dashboardets tal opdateres nu, ikke ved næste tick
    }

    // Et blik der lige har udløst noget, skal væk fra målet, før det kan udløse
    // igen. Ellers fyrer en fuld ring igen i næste frame.
    function lockGazeOn(mesh) {
      preArmedChoice = mesh; gazeTimer = 0; lastIntersectedChoice = null;
      updateGazeProgress(0);
    }

    function replayCurrentNode() {
      if (isTransitioning || !currentNode || sessionEnding) return;
      sessionLog.push({
        action: 'replay', node: currentNode.id, node_title: currentNode.title,
        session_time_sec: +((performance.now() - sessionStartTime) / 1000).toFixed(2), node_time_sec: +nodeTimer.toFixed(2)
      });
      updateGazeProgress(0);
      loadNode(currentNode);
    }

    // === Flervalg ("Vælg alle rigtige") ===
    let multiState = null;   // { meshes, confirm, done } for den viste scene
    const MULTI_DISABLED_BG = 'rgba(75,85,99,0.92)';
    const MULTI_READY_BG = 'rgba(21,128,61,0.95)';
    const MULTI_PICKED_BORDER = '#fbbf24';
    const FEEDBACK_RIGHT_BG = '#15803d';
    const FEEDBACK_WRONG_BG = '#b91c1c';

    // Hvor mange der skal krydses af før Bekræft; 0 = vilkårligt. Som standard
    // får eleven IKKE at vide, hvor mange der er rigtige. Kun med multiShowCount
    // står der "Vælg N svar", hvor N er antallet markeret rigtige.
    function multiRequired(node) {
      if (!node || node.multiShowCount !== true) return 0;
      return (node.choices || []).filter(c => c.correct === true).length;
    }
    function multiConfirmLabel(node, k) {
      const need = multiRequired(node);
      if (need) return k === need ? { text: 'Bekræft svar ✓', ready: true } : { text: 'Vælg ' + need + ' svar (' + k + '/' + need + ')', ready: false };
      return k > 0 ? { text: 'Bekræft svar ✓ (' + k + ' valgt)', ready: true } : { text: 'Vælg alle rigtige svar', ready: false };
    }

    function toggleMultiChoice(mesh) {
      if (!multiState || multiState.done) return;
      mesh.userData.selected = !mesh.userData.selected;
      restyleChoice(mesh, mesh.userData.selected ? { borderColor: MULTI_PICKED_BORDER, borderWidth: 10 } : {});
      setChoiceBadge(mesh, mesh.userData.selected ? '✓' : null, '#0969da');
      const k = multiState.meshes.filter(m => m.userData.selected).length;
      const lab = multiConfirmLabel(currentNode, k);
      restyleChoice(multiState.confirm, { backgroundColor: lab.ready ? MULTI_READY_BG : MULTI_DISABLED_BG }, lab.text);
      multiState.confirm.userData.disabled = !lab.ready;
      lockGazeOn(mesh);
    }

    // Send det afkrydsede sæt og vis facit: rigtige svar bliver grønne, forkerte
    // røde, og elevens egne valg får hvid ramme med ✓ eller ✗. Bekræft bliver Fortsæt.
    function confirmMultiChoice() {
      if (!multiState || multiState.done || multiState.confirm.userData.disabled || isTransitioning) return;
      multiState.done = true;
      const meshes = multiState.meshes;
      const isRight = m => m.userData.choiceData.correct === true;
      const picked = meshes.filter(m => m.userData.selected);
      const hits = picked.filter(isRight).length;
      const wrongPicks = picked.length - hits;
      const total = meshes.filter(isRight).length;
      const allRight = hits === total && wrongPicks === 0;
      // Logges som et almindeligt choice_made (ét svar, kun rigtigt hvis hele
      // sættet er), med detaljerne ved siden af.
      sessionLog.push({
        action: 'choice_made', multi: true, node: currentNode.id, node_title: currentNode.title,
        question: currentNode.question || '',
        choice: picked.map(m => m.userData.choiceData.label).join(' | '),
        selected: picked.map(m => m.userData.choiceData.label),
        selected_index: picked.map(m => meshes.indexOf(m)),
        correct_choices: meshes.filter(isRight).map(m => m.userData.choiceData.label),
        hits: hits, wrong_picks: wrongPicks, total_correct: total,
        correct: allRight, target: currentNode.defaultNext || null,
        session_time_sec: +((performance.now() - sessionStartTime) / 1000).toFixed(2), node_time_sec: +nodeTimer.toFixed(2)
      });
      recordLiveAnswer(currentNode.id, allRight, picked.map(m => meshes.indexOf(m)));
      updateGazeProgress(0);
      meshes.forEach(m => {
        const ok = isRight(m);
        m.userData.multiToggle = false;
        m.userData.feedback = ok ? 'right' : 'wrong';
        m.userData.originalColor = 0xffffff;
        m.material.color.setHex(0xffffff);
        restyleChoice(m, { backgroundColor: ok ? FEEDBACK_RIGHT_BG : FEEDBACK_WRONG_BG, textColor: 'white',
                           borderColor: m.userData.selected ? '#ffffff' : null, borderWidth: m.userData.selected ? 10 : 0 });
        setChoiceBadge(m, m.userData.selected ? (ok ? '✓' : '✗') : null, ok ? FEEDBACK_RIGHT_BG : FEEDBACK_WRONG_BG);
      });
      const conf = multiState.confirm;
      activeChoices = activeChoices.filter(c => meshes.indexOf(c) === -1);
      const summary = allRight ? '✓ Alle rigtige — Fortsæt →'
        : hits + ' af ' + total + ' rigtige' + (wrongPicks ? ' · ' + wrongPicks + ' forkert' + (wrongPicks > 1 ? 'e' : '') : '') + ' — Fortsæt →';
      restyleChoice(conf, { backgroundColor: 'rgba(9,105,218,0.95)' }, summary);
      conf.userData.choiceData = { __continue: true, label: 'continue' };
      conf.userData.disabled = false;
      lockGazeOn(conf);
    }

    function continueAfterMulti() {
      if (isTransitioning) return;
      isTransitioning = true;
      updateGazeProgress(0);
      goToNode(currentNode.defaultNext);
    }

    // Tegn en tekstboks' tekstur igen (farver/ramme/tekst) uden at røre
    // geometrien, så gitteret ikke flytter sig.
    function restyleChoice(mesh, overrides, newText) {
      const base = mesh.userData.textOpts;
      if (!base) return;
      const text = newText != null ? newText : mesh.userData.textLabel;
      const tmp = createTextPlane(text, Object.assign({}, base, { borderColor: null, borderWidth: 0 }, overrides, { height: mesh.userData.logicHeight }));
      if (mesh.material.map) mesh.material.map.dispose();
      mesh.material.map = tmp.material.map;
      mesh.material.needsUpdate = true;
      mesh.userData.textLabel = text;
      tmp.geometry.dispose(); tmp.material.dispose();
    }

    // Lille ✓ / ✗ i boksens øverste højre hjørne. Et barn-mesh, så blik-
    // raycastet (ikke rekursivt) aldrig rammer det.
    function setChoiceBadge(mesh, symbol, color) {
      const old = mesh.getObjectByName('choiceBadge');
      if (old) { mesh.remove(old); disposeNode(old); }
      if (!symbol) return;
      const b = createTextPlane(symbol, { width: 100, height: 100, fontSize: 72, backgroundColor: '#ffffff', textColor: color, fontWeight: '700' });
      const size = 100 / 256;
      const k = Math.min(1, mesh.userData.boxHeight * 0.55 / size);
      b.name = 'choiceBadge';
      b.scale.setScalar(k);
      b.position.set(mesh.userData.boxWidth / 2 - size * k * 0.35, mesh.userData.boxHeight / 2 - size * k * 0.35, 0.03);
      mesh.add(b);
    }

    // Planlæg afslutningen én gang, efter slutscenen har vist sit indhold.
    // Et kald mens et andet venter, ignoreres.
    function scheduleEndSession(delayMs) {
      if (endTimer || sessionEnding) return;
      endTimer = setTimeout(() => { endTimer = null; endSession(); }, delayMs);
    }

    // Afslutter både headset og flad preview. Må kun køre én gang, selvom
    // render-loopet, slut-timeren og Afslut alle kan nå hertil.
    // selfExit=true: eleven valgte selv at gå via Afslut, så "Session Done"-
    // kortet ville være misvisende.
    function endSession(selfExit) {
      if (sessionEnding) return;
      sessionEnding = true;
      if (endTimer) { clearTimeout(endTimer); endTimer = null; }
      if (xrSession) {
        if (selfExit) { xrSession.end(); return; }
        // Vis "Session Done" kort i headsettet før xrSession.end(), så eleven
        // ikke bliver trukket ud af VR uden varsel.
        showSessionCompleteMessage();
        sessionCompleteTimer = setTimeout(() => {
          sessionCompleteTimer = null;
          if (xrSession) xrSession.end();
        }, SESSION_COMPLETE_HOLD_MS);
        return;
      }
      if (flatPreview) onSessionEnd();
    }

    // === Render-loop ===
    function render() {
      // Begræns dt. Uret nulstilles ved hvert gennemløb, men en pause midt i
      // (headset taget af, systemmenu) giver hele pausen som ét dt. Med MAX_DT
      // kan ingen frame springe indhold over.
      const dt = Math.min(clock.getDelta(), MAX_DT);
      let currentTime = 0;
      trackMovement();
      checkIdle();

      if (currentNode) {
        const nodeHasVideo = !!currentNode.video;

        // Scenens tidslinje står på 0, til videoen har en rigtig første frame
        // (readyState >= HAVE_CURRENT_DATA), ellers kører overlays over en sort
        // kugle. En rummelig timeout erklærer et defekt klip fejlet.
        if (nodeHasVideo && !videoReady && !videoFailed) {
          if ((performance.now() - videoLoadStart) / 1000 > VIDEO_LOAD_TIMEOUT) {
            markVideoFailed();  // hurtigere vej, når frames kommer; timeren er sikkerhedsnettet
          } else {
            // Buffer stadig: frys tidslinjen og vis indikatoren, men hold render-
            // og blik-loopet i gang, så Play-knappen virker.
            showLoading(true);
            handleGazeInteractions(dt);
            renderer.render(scene, camera);
            return;
          }
        }
        if (videoReady) showLoading(false);

        // ---- SCENENS UR ----
        // Går kun fremad: videoen styrer det, mens den reelt spiller, og vægur
        // overtager, når den står stille. En dekoder der hænger eller
        // nulstilles, kan hverken fryse eller spole tidslinjen tilbage.
        const hasVideo = nodeHasVideo && videoElement.readyState > 0;
        let advanced = 0;
        if (hasVideo && !videoElement.ended && !videoElement.paused) {
          const vt = videoElement.currentTime;
          if (vt > lastVideoTime + 0.001) { advanced = vt - lastVideoTime; videoStalledFor = 0; }
          else { videoStalledFor += dt; }
          lastVideoTime = vt;
        } else {
          videoStalledFor += dt;   // ingen video, blokeret, hænger eller forbi slutningen
        }

        if (advanced > 0) nodeTimer += advanced;
        else if (videoStalledFor > VIDEO_STALL_GRACE) nodeTimer += dt;

        // Klippet kører, så Play-knappen har gjort sit.
        if (advanced > 0) clearPlayGate();

        currentTime = nodeTimer;

        // Vis/skjul overlays efter tidslinjen
        overlaysGroup.children.forEach(child => {
          if (child.userData.isOverlay && child.userData.startTime !== undefined) {
            child.visible = currentTime >= child.userData.startTime && currentTime <= child.userData.endTime;
          }
        });

        // Auto-advance / afslut. Afslut-knappen tæller ikke som et ventende svar,
        // ellers kunne ingen scene gå videre af sig selv.
        const choicesPending = activeChoices.some(c => !isChromeChoice(c));

        // Afslutning: en videoscene slutter ved 'ended' (aldrig på en gættet
        // varighed, hvis den er ukendt); andre scener når deres varighed er gået.
        let ended;
        if (nodeHasVideo && !videoFailed) {
          const vdur = videoElement.duration;
          ended = videoElement.ended || (isFinite(vdur) && vdur > 0 && currentTime >= vdur);
        } else {
          ended = currentTime >= (parseFloat(currentNode.duration) || 10);
        }

        if (!choicesPending && ended) {
          if (currentNode.defaultNext) {
            selectChoice({ target: currentNode.defaultNext }, true); // auto_advance, beskytter sig selv
          } else if (!isTransitioning) {
            isTransitioning = true; // slutscene uden link → afslut i stedet for at fryse
            endSession();
          }
        }
      }

      handleGazeInteractions(dt);
      renderer.render(scene, camera);
    }

    function getVisibleChoices() {
      return activeChoices.filter(c => c.visible && !c.userData.disabled && (c.parent ? c.parent.visible : true));
    }

    function handleGazeInteractions(dt) {
      const visibleChoices = getVisibleChoices();

      // Start forsinkelsen igen, når et svar dukker op, der ikke var synligt i
      // sidste frame. Pr. mesh, så svarene ved questionTime starter den, selvom
      // Afslut allerede var vist.
      let appeared = false;
      visibleChoices.forEach(c => { if (!c.userData._wasVisible) appeared = true; });
      activeChoices.forEach(c => { c.userData._wasVisible = false; });
      visibleChoices.forEach(c => { c.userData._wasVisible = true; });

      if (visibleChoices.length === 0) {
        armed = false; armTimer = 0; preArmedChoice = null;
        gazeTimer = 0; lastIntersectedChoice = null;
        updateGazeProgress(0);
        return;
      }
      if (appeared) { armed = false; armTimer = 0; preArmedChoice = null; gazeTimer = 0; }

      // Blik-stråle lige ud fra kameraets retning i verden (virker i XR).
      // recursive=false, så ringene (børn af svarene) aldrig rammes.
      camera.getWorldPosition(_gazeOrigin);
      camera.getWorldQuaternion(_gazeQuat);
      _gazeDir.set(0, 0, -1).applyQuaternion(_gazeQuat).normalize();
      raycaster.set(_gazeOrigin, _gazeDir);

      const intersects = raycaster.intersectObjects(visibleChoices, false);
      const intersectedChoice = intersects.length > 0 ? intersects[0].object : null;

      // Forsinkelsen er ikke gået: blikket må hvile her, men ringen starter først bagefter.
      if (!armed) {
        armTimer += dt;
        lastIntersectedChoice = intersectedChoice;
        gazeTimer = 0;
        if (armTimer >= GAZE_ARM_DELAY) {
          armed = true;
          // Et svar der allerede er under sigtet, når forsinkelsen udløber, er låst:
          // blikket skal væk og tilbage, før det kan vælges.
          preArmedChoice = intersectedChoice || null;
        }
        updateGazeProgress(0, intersectedChoice);
        return;
      }

      // Lås op, så snart blikket forlader det låste svar.
      if (preArmedChoice && intersectedChoice !== preArmedChoice) preArmedChoice = null;

      if (intersectedChoice && intersectedChoice !== preArmedChoice) {
        const threshold = intersectedChoice.userData.dwell || currentDwell;
        if (lastIntersectedChoice === intersectedChoice) {
          gazeTimer = Math.min(threshold, gazeTimer + dt);
          updateGazeProgress(gazeTimer / threshold, intersectedChoice);
          if (gazeTimer >= threshold) selectChoice(intersectedChoice.userData.choiceData, false, intersectedChoice);
        } else {
          gazeTimer = 0;
          lastIntersectedChoice = intersectedChoice;
          updateGazeProgress(0, intersectedChoice);
        }
      } else {
        // Intet svar, eller stadig på det låste.
        gazeTimer = 0;
        lastIntersectedChoice = intersectedChoice;
        updateGazeProgress(0, null);
      }
    }

    function updateGazeProgress(progress, targetMesh = null) {
      const p = Math.max(0, Math.min(1, progress));
      const progressIndicator = reticle.getObjectByName('gazeProgress');
      if (progressIndicator) {
        const s = Math.max(0.001, p);
        progressIndicator.scale.set(s, s, s);
      }
      activeChoices.forEach(child => {
        if (child.material && child.material.color) {
          if (child.userData.originalColor === undefined) child.userData.originalColor = child.material.color.getHex();
          child.material.color.setHex(child === targetMesh ? 0x3b82f6 : child.userData.originalColor);
        }
        // Ring på det valgte svar, så eleven kan se, at et valg er på vej.
        const ring = child.getObjectByName ? child.getObjectByName('progressRing') : null;
        if (ring) {
          if (child === targetMesh && p > 0.001) {
            ring.visible = true;
            if (ring.geometry) ring.geometry.dispose();
            ring.geometry = new THREE.RingGeometry(0.34, 0.42, 44, 1, Math.PI / 2, -p * Math.PI * 2);
          } else {
            ring.visible = false;
          }
        }
      });
    }

    // === Medier ===
    function clearOverlays() {
      while (overlaysGroup.children.length > 0) {
        const child = overlaysGroup.children[0];
        overlaysGroup.remove(child);
        if (child.type === 'Group') child.children.forEach(c => disposeNode(c));
        else disposeNode(child);
      }
      activeChoices = [];
      gazeTimer = 0;
      lastIntersectedChoice = null;
    }

    function disposeNode(child) {
      // Svar har en progressRing som barn; frigiv hele træet, så lange gennemløb
      // ikke lækker geometri/materialer.
      if (child.children) child.children.slice().forEach(disposeNode);
      if (child.geometry) child.geometry.dispose();
      if (child.material) {
        if (child.material.map) child.material.map.dispose();
        child.material.dispose();
      }
    }

    function createImagePlane(url, options = {}) {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = url;
        img.onload = () => {
          const aspect = img.width / img.height;
          const baseWidth = 4;
          const scale = options.scale || 1;
          const geo = new THREE.PlaneGeometry(baseWidth * aspect * scale, baseWidth * scale);
          const tex = new THREE.Texture(img);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.needsUpdate = true;
          const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
          resolve(new THREE.Mesh(geo, mat));
        };
        img.onerror = () => resolve(null);
      });
    }

    function createTextPlane(text, options = {}) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const logicWidth = options.width || 512;
      const minHeight = options.height || 128;
      const fontSize = options.fontSize || 32;
      const fontWeight = options.fontWeight || 'normal';
      const pixelRatio = 3;
      const padding = 20;

      // Ombryd mod den angivne bredde FØR canvas ændrer størrelse, så antallet af
      // linjer er kendt, før baggrundens højde vælges. measureText giver logiske
      // enheder uanset ctx.scale, så måling før og tegning efter passer.
      ctx.font = `${fontWeight} ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      // Hvert linjeskift starter et nyt afsnit (et tomt giver en tom linje); inden
      // for et afsnit ombrydes ordene til boksens bredde.
      let lines = [];
      String(text).replace(/\r\n?/g, '\n').split('\n').forEach(para => {
        const words = para.split(' ');
        let line = '';
        for (let n = 0; n < words.length; n++) {
          let testLine = line + words[n] + ' ';
          if (ctx.measureText(testLine).width > logicWidth - padding * 2 && n > 0) { lines.push(line); line = words[n] + ' '; }
          else line = testLine;
        }
        lines.push(line);
      });
      const lineHeight = fontSize * 1.3;
      // Aldrig lavere end den angivne højde (et kort svar får stadig en rimelig
      // knap), men altid høj nok til teksten.
      const logicHeight = Math.max(minHeight, lines.length * lineHeight + padding * 2.6);

      // Ny canvas-størrelse nulstiller hele 2D-konteksten (font, transform osv.),
      // så det skal ske efter målingen, og font/justering sættes igen herunder.
      canvas.width = logicWidth * pixelRatio;
      canvas.height = logicHeight * pixelRatio;
      ctx.scale(pixelRatio, pixelRatio);

      const textColor = options.textColor || 'white';
      const backgroundColor = options.backgroundColor || 'rgba(0,0,0,0.5)';
      const scale = options.scale || 1;

      ctx.fillStyle = backgroundColor;
      ctx.beginPath();
      const radius = 16;
      ctx.moveTo(radius, 0);
      ctx.lineTo(logicWidth - radius, 0);
      ctx.quadraticCurveTo(logicWidth, 0, logicWidth, radius);
      ctx.lineTo(logicWidth, logicHeight - radius);
      ctx.quadraticCurveTo(logicWidth, logicHeight, logicWidth - radius, logicHeight);
      ctx.lineTo(radius, logicHeight);
      ctx.quadraticCurveTo(0, logicHeight, 0, logicHeight - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fill();
      // Valgfri ramme (flervalg: afkrydset svar og elevens valg i facit). Tegnes
      // på boksens kant, så halvdelen klippes af canvas; borderWidth er det synlige.
      if (options.borderColor && options.borderWidth > 0) {
        ctx.strokeStyle = options.borderColor;
        ctx.lineWidth = options.borderWidth * 2;
        ctx.stroke();
      }

      // Valgfri vandret justering; standard er centreret.
      const align = (options.align === 'left' || options.align === 'right') ? options.align : 'center';
      const anchorX = align === 'left' ? padding : (align === 'right' ? logicWidth - padding : logicWidth / 2);
      ctx.fillStyle = textColor;
      ctx.font = `${fontWeight} ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      ctx.textAlign = align;
      ctx.textBaseline = 'middle';

      const startY = (logicHeight - (lines.length - 1) * lineHeight) / 2;
      for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i].trim(), anchorX, startY + (i * lineHeight));

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
      const geometry = new THREE.PlaneGeometry((logicWidth / 256) * scale, (logicHeight / 256) * scale);
      const mesh = new THREE.Mesh(geometry, material);
      // Eksponeret, så kaldere der stabler bokse, kan bruge den reelle højde.
      mesh.userData.boxWidth = (logicWidth / 256) * scale;
      mesh.userData.boxHeight = (logicHeight / 256) * scale;
      // Gemmes, så restyleChoice() kan tegne samme boks med nye farver.
      mesh.userData.textOpts = options;
      mesh.userData.textLabel = text;
      mesh.userData.logicHeight = logicHeight;
      return mesh;
    }

    // === Gemte resultater (genskabelse) ===
    function readSavedResults() {
      try { return JSON.parse(localStorage.getItem('lxr_results') || '[]'); }
      catch (e) { return []; }
    }

    function renderSavedResults() {
      const host = document.getElementById('saved-results');
      if (!host) return;
      const saved = readSavedResults();
      if (!saved.length) { host.innerHTML = ''; return; }
      host.innerHTML =
        '<div class="saved-title">Saved results on this headset (' + saved.length + ')</div>' +
        '<button id="download-saved" class="link-btn">Download all again</button> ' +
        '<button id="clear-saved" class="link-btn danger">Clear</button>';
      document.getElementById('download-saved').addEventListener('click', downloadSavedResults);
      document.getElementById('clear-saved').addEventListener('click', () => {
        if (!confirm('Delete the results stored on this headset?')) return;
        try { localStorage.removeItem('lxr_results'); } catch (e) {}
        renderSavedResults();
        updateStatus('Saved results cleared');
      });
    }

    function downloadSavedResults() {
      const saved = readSavedResults();
      saved.forEach((entry, i) => {
        setTimeout(() => {
          try {
            const blob = new Blob([JSON.stringify(entry.results, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = entry.fileName;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 4000);
          } catch (e) {}
        }, i * 350); // forskudt; browsere dropper mange samtidige downloads
      });
      updateStatus('Re-downloading ' + saved.length + ' result file(s)');
    }

    function updateStatus(message, isError = false) {
      statusElement.textContent = message;
      statusElement.style.display = 'block';
      statusElement.style.background = isError ? 'rgba(220, 38, 38, 0.95)' : 'rgba(17, 24, 39, 0.9)';
      setTimeout(() => { statusElement.style.display = 'none'; }, isError ? 5000 : 3000);
    }

    init();
    // Svarer relay.py/cloud-relayet, sker det næsten med det samme. Ellers
    // forbliver relayAvailable false, og alle relay-kald ovenfor gør ingenting.
    checkRelay();
  </script>
</body>
